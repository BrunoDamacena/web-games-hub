<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and play simple browser games at Web Games Hub.">
  <title>Web Games Hub · Games</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header"><nav>
    <a class="brand" href="./"><span class="mark" aria-hidden="true">◎</span> <span class="brand-name">Web Games Hub</span></a>
    <a class="nav-link" href="./">All games</a>
  </nav></header>
  <main>
    <section id="games" aria-labelledby="games-title">
      <div class="intro">
        <p class="eyebrow"><span></span> THE PUZZLE ARCADE</p>
        <h1 id="games-title">All <em>games</em></h1>
      </div>
      <nav class="game-menu" aria-label="Games">
        <a class="game-card" href="./games/ring-sort/" aria-label="Play Ring Sort">
          <span class="card-art" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Ring Sort</strong><small>Sort colorful rings at your own pace.</small></span>
          <span class="play-label">Play</span>
        </a>
        <a class="game-card" href="./games/palavra/" aria-label="Play Palavra">
          <span class="card-art word-art" aria-hidden="true"><b>P</b><b>A</b><b>L</b></span>
          <span><strong>Palavra</strong><small>Guess a five-letter Brazilian Portuguese word.</small></span>
          <span class="play-label">Play</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
