<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Escolha um jogo e divirta-se no navegador com a Central de Jogos.">
  <title>Central de Jogos</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header"><nav>
    <a class="brand" href="./"><span class="mark" aria-hidden="true">◎</span> <span class="brand-name">Central de Jogos</span></a>
    <div class="header-actions">
      <button id="site-theme" class="theme-switch" type="button" role="switch"
              aria-label="Modo escuro" aria-checked="false" hidden>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
        </svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 15.1A9 9 0 0 1 8.9 3.5a9 9 0 1 0 11.6 11.6Z"/>
        </svg>
      </button>
    </div>
  </nav></header>
  <main>
    <nav class="game-menu" aria-label="Jogos">
      <a class="game-card" href="./games/ring-sort/" aria-label="Jogar Anéis por Cor">
        <span class="card-art" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Anéis por Cor</strong><small>Separe os anéis por cor no seu ritmo.</small></span>
        <span class="play-label">Jogar</span>
      </a>
      <a class="game-card" href="./games/palavra/" aria-label="Jogar Palavra">
        <span class="card-art word-art" aria-hidden="true"><b>P</b><b>A</b><b>L</b></span>
        <span><strong>Palavra</strong><small>Adivinhe uma palavra de cinco letras em português.</small></span>
        <span class="play-label">Jogar</span>
      </a>
    </nav>
  </main>
</body>
</html>
